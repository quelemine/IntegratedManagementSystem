services:
  - type: web
    name: integrated-management-system-api
    env: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_CLIENT
        value: pg
      - key: DB_HOST
        fromDatabase:
          name: integrated-management-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: integrated-management-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: integrated-management-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: integrated-management-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: integrated-management-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://your-vercel-app.vercel.app
      - key: CORS_ORIGIN
        value: https://your-vercel-app.vercel.app
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
      - key: LOG_LEVEL
        value: info
      - key: LOG_FILE_PATH
        value: logs

databases:
  - name: integrated-management-db
    plan: free
    databaseName: integrated_management_system
    user: ims_user
